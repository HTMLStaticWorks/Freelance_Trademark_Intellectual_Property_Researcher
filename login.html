<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | IPShield Research</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#14213D', light: '#1f3560', dark: '#0a1120' },
                        secondary: { DEFAULT: '#FCA311', light: '#fdbd50', dark: '#d68704' },
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-dark-bg dark:text-gray-200 transition-colors duration-300 font-sans antialiased min-h-screen flex items-center justify-center p-4 md:p-12 relative overflow-x-hidden">

    <!-- Background Elements -->
    <div class="absolute inset-0 bg-grid-pattern opacity-10"></div>
    <div class="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-primary/10 to-transparent blur-3xl -z-10"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-secondary/10 rounded-full blur-[120px] mix-blend-screen -z-10"></div>

    <!-- Toggles (Top Right) -->
    <div class="fixed top-4 right-4 md:top-6 md:right-6 flex items-center gap-2 bg-white/50 dark:bg-dark-card/50 backdrop-blur-md px-3 py-1.5 md:px-4 md:py-2 rounded-full border border-gray-200 dark:border-white/10 z-20 shadow-sm">
        <button id="theme-toggle" class="p-2 text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-secondary transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-white/10" aria-label="Toggle Theme">
            <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>
        <div class="w-px h-4 bg-gray-300 dark:bg-gray-600"></div>
        <button id="rtl-toggle" class="text-xs font-bold text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-secondary px-2">RTL</button>
    </div>

    <!-- Auth Card -->
    <div class="w-full max-w-md relative z-10 animate-on-scroll scale-up is-visible py-8">
        <div class="bg-white dark:bg-dark-card rounded-3xl p-8 md:p-10 shadow-2xl border border-gray-100 dark:border-white/10 relative overflow-hidden">
            <!-- Top Accent line -->
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary to-secondary"></div>

            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="w-12 h-12 bg-gradient-to-br from-primary to-primary-light dark:from-secondary dark:to-secondary-dark rounded-xl flex items-center justify-center text-white dark:text-primary font-bold shadow-lg shadow-primary/20 dark:shadow-secondary/20">
                        <i data-lucide="scale" class="w-6 h-6"></i>
                    </div>
                    <span class="font-heading font-bold text-3xl text-primary dark:text-white tracking-tight">IP<span class="text-secondary">Shield</span></span>
                </a>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold font-heading text-gray-900 dark:text-white mb-2">Welcome Back</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Secure login to your client portal</p>
            </div>

            <!-- SSO Buttons -->
            <div class="space-y-3 mb-8">
                <button class="w-full flex items-center justify-center gap-3 bg-white dark:bg-dark-bg border border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-200 font-medium py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-white/5 transition-colors shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
                <button class="w-full flex items-center justify-center gap-3 bg-white dark:bg-dark-bg border border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-200 font-medium py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-white/5 transition-colors shadow-sm">
                    <svg class="w-5 h-5 text-gray-900 dark:text-white" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.126 3.822 3.08 1.567-.042 2.16-.994 4.056-.994 1.894 0 2.428.994 4.056.994 1.683 0 2.704-1.506 3.71-2.96 1.158-1.682 1.636-3.322 1.66-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.484-4.516 2.597-4.587-1.425-2.083-3.64-2.324-4.39-2.376-2-.15-3.925 1.09-4.927 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.702z"/></svg>
                    Continue with Apple
                </button>
            </div>

            <div class="flex items-center gap-4 mb-8">
                <div class="h-px bg-gray-200 dark:bg-white/10 flex-1"></div>
                <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Or login with email</span>
                <div class="h-px bg-gray-200 dark:bg-white/10 flex-1"></div>
            </div>

            <!-- Form -->
            <form action="dashboard.html" method="GET" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Work Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="email" placeholder="Enter your work email" class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-white/10 rounded-xl text-sm focus:bg-white dark:focus:bg-dark-card focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all text-gray-800 dark:text-white" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" placeholder="Enter your password" class="w-full pl-10 pr-10 py-3 bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-white/10 rounded-xl text-sm focus:bg-white dark:focus:bg-dark-card focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all text-gray-800 dark:text-white" required>
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-primary dark:hover:text-secondary focus:outline-none">
                            <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-secondary focus:ring-secondary dark:border-gray-600 dark:bg-dark-bg">
                        <span class="text-sm text-gray-600 dark:text-gray-400">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-primary dark:text-secondary font-semibold hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full bg-primary hover:bg-primary-light text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-primary/20 text-sm flex items-center justify-center gap-2 mt-4 hover:-translate-y-0.5">
                    Sign In to Portal <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
                Don't have an account? <a href="signup.html" class="text-primary dark:text-secondary font-bold hover:underline">Request Access</a>
            </div>
        </div>
    </div>

    <!-- Init JS & Password Toggle -->
    <script src="assets/js/main.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
